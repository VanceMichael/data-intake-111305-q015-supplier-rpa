[project]
name = "supplier-rpa"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = []

[tool.unittest]
start-directory = "tests"

[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["supplier_rpa", "supplier_rpa.fixtures"]

[tool.setuptools.package-dir]
"supplier_rpa.fixtures" = "fixtures"

[tool.setuptools.package-data]
"supplier_rpa.fixtures" = ["*.json"]
